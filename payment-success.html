<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131d"><title>Payment status | Maxi Ceelaw Photography</title><link rel="stylesheet" href="styles.css"></head><body><main class="intro" style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center"><p class="eyebrow">MAXI CEELAW PHOTOGRAPHY</p><h2 id="heading">Checking your payment…</h2><p id="status">Please wait while we confirm the transaction with Paystack.</p><a class="btn btn-gold" href="https://wa.me/2347036055158" target="_blank" rel="noopener">Contact us on WhatsApp</a><p><a href="/" style="color:#d5ad62">Return to website</a></p></main><script>const params=new URLSearchParams(location.search);const ref=params.get('reference')||params.get('trxref');const heading=document.getElementById('heading');const status=document.getElementById('status');if(!ref){heading.textContent='Payment reference not found';status.textContent='Please check your Paystack receipt and contact us on WhatsApp.';}else{fetch('/.netlify/functions/verify-payment?reference='+encodeURIComponent(ref)).then(r=>r.json().then(d=>({ok:r.ok,data:d}))).then(({ok,data})=>{if(ok&&data.status==='success'){heading.textContent='Payment confirmed';status.textContent='Your booking deposit has been confirmed. Please message us on WhatsApp so we can acknowledge your event date. Reference: '+data.reference;}else{heading.textContent='Payment not confirmed yet';status.textContent='Paystack has not confirmed this transaction as successful. Please contact us with your receipt if you believe you were charged.';}}).catch(()=>{heading.textContent='We could not verify the payment';status.textContent='Please contact us on WhatsApp with your Paystack receipt.';});}</script></body></html>
